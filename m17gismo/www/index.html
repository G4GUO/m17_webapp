<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m17web - M17 SDR</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%93%A1</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>m17web</h1>
  <div class="hdr-item"><span class="lbl">radio</span><span id="radio" class="val">-</span></div>
  <div class="hdr-item"><span class="lbl">mode</span><span id="mode" class="val">-</span></div>
  <div class="hdr-item"><span class="lbl">audio</span><span id="audiobackend" class="val">-</span></div>
  <div class="hdr-item"><span class="lbl">clients</span><span id="clients" class="val">0</span></div>
  <div id="link" class="link off">offline</div>
</header>

<main>
  <section class="col">
    <div class="card ptt">
      <div class="pttstate"><span id="pttled" class="led">RX</span>
        <span id="frameind" class="badge">no signal</span></div>
      <button id="pttbtn" class="ptt-button" disabled>HOLD TO&nbsp;TALK<span class="hint">(or hold space)</span></button>
      <div class="row">
        <button id="breakbtn" class="mini">break</button>
        <button id="carrierbtn" class="mini">carrier</button>
        <button id="duplexbtn" class="mini">duplex</button>
      </div>
      <div class="row">
        <label class="meter"><span>signal</span><progress id="signalbar" max="1" value="0"></progress></label>
        <label class="meter"><span>power</span><progress id="powerbar" max="1" value="0"></progress></label>
      </div>
    </div>

    <div class="card">
      <h2>Station</h2>
      <div class="grid2">
        <label>my callsign<input id="src" maxlength="9" placeholder="G4GUO"></label>
        <label>destination<input id="dst" maxlength="9" placeholder="ALL"></label>
        <label>gateway<input id="gate" maxlength="9" placeholder="G4GUO G"></label>
        <label class="chk"><input type="checkbox" id="listenall"> listen to all</label>
      </div>
      <div class="row">
        <button data-cmd="ba">broadcast (ba)</button>
        <button data-cmd="h">help</button>
        <button data-cmd="w">clear log</button>
      </div>
    </div>

    <div class="card">
      <h2>Radio</h2>
      <div class="grid2">
        <label>RX frequency (Hz)<input id="rxfreq" type="number" step="1" min="1"></label>
        <label>TX frequency (Hz)<input id="txfreq" type="number" step="1" min="1"></label>
        <label>RX gain <output id="rggainout">0.00</output>
          <input id="rggain" type="range" min="0" max="1" step="0.05"></label>
        <label>TX gain <output id="tggainout">0.00</output>
          <input id="tggain" type="range" min="0" max="1" step="0.05"></label>
        <label>freq correction<input id="fc" type="number" step="0.000001" min="0.9" max="1.1"></label>
        <label class="chk"><input type="checkbox" id="afc"> AFC</label>
      </div>
      <div class="row">
        <button id="freqapply">apply frequencies</button>
        <button data-cmd="tc">transmit carrier</button>
        <button data-cmd="rx">receive</button>
      </div>
      <div class="row simrow" id="simrow">
        <span class="lbl">simulator:</span>
        <label class="chk"><input type="checkbox" id="simloop" checked> loopback</label>
        <label class="chk"><input type="checkbox" id="simrt" checked> real time</label>
        <label>noise<input id="simnoise" type="range" min="0" max="0.2" step="0.005" value="0.002"></label>
      </div>
    </div>

    <div class="card">
      <h2>Reflector</h2>
      <div class="grid2">
        <label>reflector<select id="refname"></select></label>
        <label>module<input id="refmod" maxlength="1" value="C"></label>
      </div>
      <div class="row">
        <button id="connbtn">connect</button>
        <button id="discbtn" data-cmd="disc">disconnect</button>
        <span id="refstatus" class="badge">not connected</span>
      </div>
    </div>

    <div class="card">
      <h2>Audio</h2>
      <div class="row">
        <button id="audioenable">enable browser audio</button>
        <label>backend <select id="audioselect">
          <option value="browser">browser</option>
          <option value="pulse">local sound card</option>
          <option value="both">browser + local</option>
          <option value="none">mute</option>
        </select></label>
      </div>
      <div class="row">
        <label class="meter"><span>mic</span><progress id="micbar" max="1" value="0"></progress></label>
        <label class="meter"><span>spk</span><progress id="spkbar" max="1" value="0"></progress></label>
      </div>
      <div class="row">
        <label>volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></label>
        <label class="chk"><input type="checkbox" id="mute"> mute</label>
      </div>
      <p class="note" id="audionote">Browser audio needs a click to start (browser autoplay rules).</p>
    </div>
  </section>

  <section class="col wide">
    <div class="card log-card">
      <h2>Console <span class="lbl" id="logcount"></span></h2>
      <div id="log" class="log"></div>
      <form id="cmdform" autocomplete="off">
        <span class="prompt">&gt;&gt;</span>
        <input id="cmdinput" placeholder="type a command (h for help)">
        <button type="submit">send</button>
      </form>
    </div>
    <div class="card">
      <h2>Command help</h2>
      <pre id="help" class="help"></pre>
    </div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
